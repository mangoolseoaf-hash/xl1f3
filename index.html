body{background:var(--bg);color:var(--fg);font-family:var(--mono);overflow-x:hidden;font-size:15px;line-height:1.5}

/* cursor de bloque para type effects */
.typing:after,.caret:after{content:"█";margin-left:2px;color:var(--green);animation:blink 1s steps(1) infinite}

/* ---------- helpers ---------- */
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hostOf = u => new URL(u).hostname.replace(/^www\./,'');
const root = document.documentElement;

/* ---------- type in / type out ---------- */
const timers = new WeakMap();
const cancel = el => { clearTimeout(timers.get(el)); };
function typeIn(el){
  cancel(el);
  const full = el.dataset.type || '';
  let i = 0;
  el.classList.add('typing');
  const step = () => {
    el.textContent = full.slice(0, i++);
    if (i <= full.length) timers.set(el, setTimeout(step, 22 + Math.random() * 28));
    else el.classList.remove('typing');
  };
  step();
}
function typeOut(el){
  cancel(el);
  const step = () => {
    const s = el.textContent.slice(0, -1);
    el.textContent = s;
    if (s.length) timers.set(el, setTimeout(step, 14));
    else el.classList.remove('typing');
  };
  el.classList.add('typing');
  step();
}
const typeIO = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) typeIn(en.target);
    else if (en.target.textContent.length) typeOut(en.target);
  });
}, {threshold:.6});

/* ---------- render ---------- */
const sectionsEl = document.getElementById('sections');
const chipsEl = document.getElementById('chips');
const qEl = document.getElementById('q');
const countEl = document.getElementById('count');
const noneEl = document.getElementById('none');
const sections = [];
let total = 0, activeCat = '';

// hero typing
document.querySelectorAll('[data-type]').forEach(el => {
  el.dataset.type = el.dataset.type; // ya viene del HTML
  el.textContent = '';
  typeIO.observe(el);
});

Object.entries(registry).forEach(([cat, items]) => {
  total += items.length;
  const id = 's-' + norm(cat).replace(/[^a-z0-9]+/g,'-');
  const sec = document.createElement('section');
  sec.className = 'sec';
  sec.id = id;
  sec.dataset.cat = cat;
  sec.innerHTML = `
    <h2 class="sec-head" data-type="[ dir ] ${esc(cat)}/"></h2>
    <p class="sec-meta">${items.length} entradas · $ ls -la</p>
    <div class="list">
      ${items.map(([name,url]) => `
        <a class="row" href="${esc(url)}" target="_blank" rel="noopener noreferrer"
           data-search="${esc(norm(name+' '+cat+' '+hostOf(url)))}">
          <span class="pfx">&gt;</span>
          <span class="txt">
            <span class="name" data-raw="${esc(name)}">${esc(name)}</span>
            <span class="host">${esc(hostOf(url))}</span>
          </span>
          <span class="go">[open]</span>
        </a>`).join('')}
    </div>`;
  sectionsEl.appendChild(sec);
  const h = sec.querySelector('.sec-head');
  h.textContent = '';
  typeIO.observe(h);
  sections.push({sec, cat});

  const chip = document.createElement('button');
  chip.className = 'chip'; chip.textContent = cat; chip.dataset.cat = cat;
  chip.setAttribute('aria-pressed','false');
  chipsEl.appendChild(chip);
});

allChip.className = 'chip'; allChip.textContent = 'todo'; allChip.dataset.cat = '';
allChip.setAttribute('aria-pressed','true');
chipsEl.prepend(allChip);

// filas aparecen en cascada al entrar
const rowIO = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    en.target.querySelectorAll('.row').forEach((r,i) => setTimeout(() => r.classList.add('in'), i * 35));
    rowIO.unobserve(en.target);
  });
}, {threshold:.1});
sections.forEach(({sec}) => rowIO.observe(sec.querySelector('.list')));

/* ---------- búsqueda ---------- */
function applyFilter(){
  const terms = norm(qEl.value.trim()).split(/\s+/).filter(Boolean);
  let shown = 0;
  sections.forEach(({sec, cat}) => {
    const off = activeCat && cat !== activeCat;
    let here = 0;
    sec.querySelectorAll('.row').forEach(a => {
      const ok = !off && terms.every(t => a.dataset.search.includes(t));
      a.style.display = ok ? '' : 'none';
      if (ok){ here++; shown++; }
      const nameEl = a.querySelector('.name');
      const raw = nameEl.dataset.raw;
      if (terms.length && ok){
        const n = norm(raw);
        let idx = -1, len = 0;
        for (const t of terms){ const i = n.indexOf(t); if (i >= 0){ idx = i; len = t.length; break; } }
        nameEl.innerHTML = idx >= 0
          ? esc(raw.slice(0,idx)) + '<mark>' + esc(raw.slice(idx,idx+len)) + '</mark>' + esc(raw.slice(idx+len))
          : esc(raw);
      } else nameEl.textContent = raw;
    });
    sec.classList.toggle('hidden', here === 0);
  });
  countEl.textContent = (terms.length || activeCat) ? `> ${shown} / ${total} coincidencias` : '';
  noneEl.classList.toggle('show', shown === 0);
}
qEl.addEventListener('input', applyFilter);
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); }
  if (e.key === 'Escape'){ qEl.value=''; activeCat=''; syncChips(); applyFilter(); qEl.blur(); }
});
function syncChips(){
  chipsEl.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.cat === activeCat)));

chipsEl.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  activeCat = c.dataset.cat; syncChips(); applyFilter();
  if (activeCat) document.getElementById('s-' + norm(activeCat).replace(/[^a-z0-9]+/g,'-'))?.scrollIntoView({behavior:'smooth'});
});

/* ---------- scroll: progreso y parallax ---------- */
let ticking = false;
function onScroll(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const max = root.scrollHeight - innerHeight;
    root.style.setProperty('--p', max > 0 ? Math.min(1, scrollY / innerHeight).toFixed(4) : 0);
    const bar = document.getElementById('progress');
    bar.style.setProperty('--p', max > 0 ? (scrollY / max).toFixed(4) : 0);
    ticking = false;
  });
}
addEventListener('scroll', onScroll, {passive:true});
addEventListener('resize', onScroll);
onScroll();

/* ---------- lluvia de fondo (hero) ---------- */
(() => {
  const c = document.getElementById('rain');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { c.style.display = 'none'; return; }
  const ctx = c.getContext('2d');
  const chars = '01xL1F3<>/{}[];=#$%'.split('');
  let cols = 0, drops = [], size = 16;
  function resize(){
    c.width = c.clientWidth; c.height = c.clientHeight;
    cols = Math.floor(c.width / size);
    drops = Array.from({length: cols}, () => Math.random() * -50);
  }
  resize();
  addEventListener('resize', resize);
  function draw(){
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = size + 'px monospace';
    for (let i = 0; i < cols; i++){
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * size, drops[i] * size);
      if (drops[i] * size > c.height && Math.random() > .975) drops[i] = 0;
      drops[i] += .6;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ---------- música de fondo ---------- */
const bgm = document.getElementById('bgm');
const volBtn = document.getElementById('vol');
let started = false;
bgm.volume = .35;
function setVol(){
  volBtn.textContent = started && !bgm.muted ? '[ MÚSICA: ON ]' : '[ MÚSICA: OFF ]';
  volBtn.classList.toggle('on', started && !bgm.muted);
}
function startMusic(){
  if (started) return;
  bgm.play().then(() => { started = true; setVol(); }).catch(() => {});
}
// el navegador exige un gesto antes de reproducir con sonido
['pointerdown','keydown','wheel','touchstart'].forEach(ev =>
  addEventListener(ev, startMusic, {once:true, passive:true})
);
volBtn.addEventListener('click', () => {
  if (!started){ startMusic(); return; }
  bgm.muted = !bgm.muted;
  setVol();
});
setVol();
</script>
